{% extends "base.html" %}

{% block titulo %}Cadastrar Produto - Folha D'Água{% endblock %}
{% block cabecalho %}Cadastrar Produto{% endblock %}
{% block descricao %}Adicione um novo produto ao catálogo.{% endblock %}

{% block conteudo %}
<section class="formulario-container">
    <form action="{{ url_for('cadastrar_produto_admin') }}" method="POST" enctype="multipart/form-data">
        <div class="campo">
            <label for="tipo_produto">Tipo do produto</label>
            <select id="tipo_produto" name="tipo_produto" required>
                <option value="">Selecione o tipo</option>
                <option value="Buquê">Buquê</option>
                <option value="Arranjo">Arranjo</option>
                <option value="Flor individual">Flor individual</option>
            </select>
        </div>
        <div class="campo">
            <label for="nome_flor">Nome do produto</label>
            <input type="text" id="nome_flor" name="nome_flor" maxlength="150" placeholder="Ex: Rosas Vermelhas" required>
        </div>
        <div class="linha">
            <div class="campo">
                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" name="preco" placeholder="0.00" step="0.01" min="0.01" required>
            </div>
            <div class="campo">
                <label for="estoque">Estoque</label>
                <input type="number" id="estoque" name="estoque" min="0" step="1" placeholder="Quantidade" required>
            </div>
        </div>
        <div class="campo">
            <label for="imagem">Foto do produto (opcional)</label>
            <input type="file" id="imagem" name="imagem" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
        </div>
        <div class="botoes">
            <a href="{{ url_for('estoque_admin') }}" class="botao cancelar">Cancelar</a>
            <button type="submit" class="botao cadastrar">Cadastrar produto</button>
        </div>
    </form>
</section>
{% endblock %}
