
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - Folha D'Água</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>
    <div class="admin-container">

        <aside class="sidebar">
            <div class="logo">
                🌷
                <h2>Folha D'Água</h2>
                <span>Administrador</span>
            </div>

            <nav>
                <a href="{{ url_for('admin') }}">Dashboard</a>
                <a href="{{ url_for('cadastrar_produto_admin') }}">Produtos</a>
                <a href="{{ url_for('estoque_admin') }}" class="ativo">Estoque</a>
                <a href="#">Encomendas</a>
                <a href="#">Clientes</a>
            </nav>
        </aside>

        <main class="conteudo">

            <header class="topo">
                <div>
                    <h1>Estoque</h1>
                    <p>Visualize e gerencie o estoque dos produtos.</p>
                </div>
            </header>

            <section class="estoque-container">

                <div class="pesquisa-estoque">
                    <span>🔍</span>
                    <input
                        type="search"
                        id="pesquisarProduto"
                        placeholder="Pesquisar produto..."
                        oninput="pesquisarProdutos()"
                    >
                </div>

                <div class="tabela-estoque">

                    <div class="cabecalho-tabela">
                        <span>Produto</span>
                        <span>Tipo</span>
                        <span>Preço</span>
                        <span>Estoque</span>
                        <span>Ações</span>
                    </div>

                    {% for produto in produtos %}

                    <div class="item-estoque">

                        <span>{{ produto[2] }}</span>

                        <span>{{ produto[1] }}</span>

                        <span>R$ {{ produto[3] }}</span>

                        <form
                            action="{{ url_for('atualizar_estoque_admin', id=produto[0]) }}"
                            method="POST"
                            class="form-estoque"
                        >
                            <input
                                type="number"
                                name="estoque"
                                value="{{ produto[4] }}"
                                min="0"
                                required
                            >
                            <button type="submit">Salvar</button>
                        </form>

                        <div class="acoes-produto">

                            <a
                                href="{{ url_for('editar_produto_admin', id=produto[0]) }}"
                                class="botao-editar"
                            >
                                Editar
                            </a>

                            <form
                                action="{{ url_for('excluir_produto_admin', id=produto[0]) }}"
                                method="POST"
                                onsubmit="return confirm('Deseja realmente excluir este produto?')"
                            >
                                <button type="submit" class="botao-excluir">
                                    Excluir
                                </button>
                            </form>

                        </div>

                    </div>

                    {% endfor %}

                </div>

            </section>

        </main>
    </div>

    <script>
        function pesquisarProdutos() {
            const pesquisa = document
                .getElementById("pesquisarProduto")
                .value
                .toLowerCase();

            const produtos = document.querySelectorAll(".item-estoque");

            produtos.forEach(produto => {
                const nome = produto.children[0].textContent.toLowerCase();
                const tipo = produto.children[1].textContent.toLowerCase();

                const encontrado =
                    nome.includes(pesquisa) || tipo.includes(pesquisa);

                produto.style.display = encontrado ? "" : "none";
            });
        }
    </script>

</body>
</html>
